<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lulu Admin</title>
<link rel="icon" href="/images/logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="hero">
  <img class="logo small" src="/images/logo.png?v=2" alt="Lulu Artisan Goods">
  <h1>Shop admin</h1>
</header>

<section class="admin" id="login">
  <form class="panel" id="loginForm">
    <label class="field">Password <input type="password" id="pw" required autocomplete="current-password"></label>
    <button class="primary" type="submit">Sign in</button>
    <p class="note" id="loginMsg" hidden></p>
  </form>
</section>

<section class="admin" id="app" hidden>
  <nav class="tabs admin-tabs">
    <a href="#list" class="on" data-tab="list">New-piece list <span id="listCount"></span></a>
    <a href="#orders" data-tab="orders">Orders <span id="orderCount"></span></a>
    <button class="link" id="refresh">Refresh</button>
    <button class="link" id="logout">Sign out</button>
  </nav>

  <div class="tab" id="tab-list">
    <div class="actions">
      <button class="primary" id="copyEmails">Copy all emails for BCC</button>
      <button class="secondary" id="csvList">Download list (CSV)</button>
    </div>
    <p class="note" id="copyMsg" hidden></p>
    <div class="table-wrap"><table id="listTable"></table></div>
  </div>

  <div class="tab" id="tab-orders" hidden>
    <div class="actions">
      <button class="secondary" id="csvOrders">Download orders (CSV)</button>
    </div>
    <div id="orderCards"></div>
  </div>
</section>

<script src="/admin/admin.js"></script>
</body>
</html>
